<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard — Air Connect Ltd Semi-OTA Management</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=29">
  <style>
    .admin-shell {
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: calc(100vh - 72px);
    }
    .admin-sidebar {
      background: #111827;
      color: #cbd5e1;
      padding: 22px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .admin-nav-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 0;
      background: transparent;
      color: #cbd5e1;
      font-weight: 600;
      font-size: 14px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
    }
    .admin-nav-btn:hover,
    .admin-nav-btn.active {
      background: var(--brand-primary);
      color: #fff;
    }
    .admin-main {
      padding: 28px;
      background: #f1f5f9;
      overflow-x: auto;
    }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .kpi-card {
      background: #fff;
      border-radius: 14px;
      padding: 20px;
      border: 1px solid var(--line);
      box-shadow: var(--shadow-sm);
    }
    .kpi-card small {
      color: var(--muted);
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
    }
    .kpi-card strong {
      display: block;
      font-size: 26px;
      font-weight: 800;
      color: var(--ink);
      margin-top: 6px;
    }
    .admin-table-wrap {
      background: #fff;
      border-radius: 16px;
      border: 1px solid var(--line);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      overflow-x: auto;
    }
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .admin-table th,
    .admin-table td {
      padding: 11px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
    }
    .admin-table th {
      background: #f8fafc;
      font-weight: 800;
      color: var(--ink);
      font-size: 12px;
      text-transform: uppercase;
    }
    @media (max-width: 900px) {
      .admin-shell {
        grid-template-columns: 1fr;
      }
      .admin-sidebar {
        flex-direction: row;
        overflow-x: auto;
      }
      .admin-nav-btn {
        white-space: nowrap;
        width: auto;
      }
    }
  </style>
</head>
<body>

  <header class="ota-header">
    <div class="container ota-header-inner">
      <a href="/" class="brand-logo">
        <img src="assets/logo.jpg" alt="Air Connect Ltd">
        <div class="brand-logo-text">
          <strong>Air Connect — Admin Control Panel</strong>
          <small>Manage Bookings, E-Tickets, Flights, Hotels, Umrah &amp; Settings</small>
        </div>
      </a>
      <div style="display:flex;align-items:center;gap:10px">
        <a href="/" class="btn btn-outline btn-sm">View Live Website</a>
        <button type="button" id="admin-logout-btn" class="btn btn-outline btn-sm" hidden onclick="window.ACAdmin.logoutAdmin()">Logout</button>
      </div>
    </div>
  </header>

  <!-- Admin Login Gate -->
  <div id="admin-login-gate" class="container" style="max-width:460px;padding:64px 20px">
    <div class="checkout-box" style="text-align:center">
      <img src="assets/logo.jpg" alt="Logo" style="width:56px;height:56px;border-radius:12px;margin-bottom:10px">
      <h2>Admin Portal Sign In</h2>
      <p style="font-size:13px;color:var(--muted);margin:6px 0 20px">Sign in with your authorized Air Connect Ltd administrator account.</p>
      <form id="admin-login-form" style="text-align:left">
        <div class="form-field">
          <label>Admin Email *</label>
          <input type="email" id="adm-email" value="info@airconnectbd.com" required>
        </div>
        <div class="form-field">
          <label>Password *</label>
          <input type="password" id="adm-pass" placeholder="Enter Admin Password" required>
        </div>
        <button type="submit" id="adm-login-btn" class="btn btn-primary" style="width:100%;margin-top:8px">Sign In to Dashboard</button>
      </form>
    </div>
  </div>

  <!-- Authenticated Admin Shell -->
  <div id="admin-app-shell" class="admin-shell" hidden>
    <aside class="admin-sidebar">
      <button type="button" class="admin-nav-btn active" data-adm-tab="bookings" onclick="window.ACAdmin.switchTab('bookings')">
        Bookings &amp; Ticketing
      </button>
      <button type="button" class="admin-nav-btn" data-adm-tab="customers" onclick="window.ACAdmin.switchTab('customers')">
        Customer Database
      </button>
      <button type="button" class="admin-nav-btn" data-adm-tab="requests" onclick="window.ACAdmin.switchTab('requests')">
        Refund &amp; Reissue
      </button>
      <button type="button" class="admin-nav-btn" data-adm-tab="flights" onclick="window.ACAdmin.switchTab('flights')">
        Flight Deals &amp; Routes
      </button>
      <button type="button" class="admin-nav-btn" data-adm-tab="packages" onclick="window.ACAdmin.switchTab('packages')">
        Umrah &amp; Tour Packages
      </button>
      <button type="button" class="admin-nav-btn" data-adm-tab="hotels" onclick="window.ACAdmin.switchTab('hotels')">
        Hotels Catalog
      </button>
      <button type="button" class="admin-nav-btn" data-adm-tab="visas" onclick="window.ACAdmin.switchTab('visas')">
        Visas &amp; Banners
      </button>
      <button type="button" class="admin-nav-btn" data-adm-tab="settings" onclick="window.ACAdmin.switchTab('settings')">
        Site &amp; Payment Settings
      </button>
    </aside>

    <main class="admin-main" id="admin-main-content"></main>
  </div>

  <!-- Floating WhatsApp Live Support Button (Bottom-Right Corner) -->
  <a id="floating-wa-link" href="https://wa.me/8801322937800?text=Hello%20Air%20Connect%20Ltd%2C%20I%20need%20assistance%20with%20a%20booking." target="_blank" rel="noopener" class="wa-float" aria-label="Chat on WhatsApp">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <path d="M16.004 2.667C8.64 2.667 2.667 8.64 2.667 16c0 2.35.612 4.644 1.775 6.67L2.56 29.333l6.835-1.792A13.28 13.28 0 0 0 16.004 29.333c7.363 0 13.33-5.973 13.33-13.333 0-3.562-1.387-6.912-3.904-9.43A13.245 13.245 0 0 0 16.004 2.667zm0 24.413c-1.99 0-3.943-.535-5.647-1.547l-.405-.24-4.205 1.102 1.122-4.098-.264-.42A11.04 11.04 0 0 1 4.92 16c0-6.112 4.973-11.084 11.084-11.084 2.96 0 5.743 1.153 7.835 3.247a11.01 11.01 0 0 1 3.245 7.837c0 6.112-4.97 11.08-11.08 11.08zm6.08-8.297c-.333-.167-1.97-.972-2.275-1.083-.305-.111-.527-.167-.75.167-.222.333-.86 1.083-1.055 1.305-.194.222-.388.25-.721.083-.333-.167-1.406-.518-2.678-1.652-.99-.883-1.658-1.974-1.852-2.307-.194-.333-.02-.514.146-.68.15-.15.333-.389.5-.583.166-.195.222-.334.333-.556.111-.222.056-.417-.028-.583-.083-.167-.75-1.805-1.027-2.472-.27-.65-.546-.562-.75-.572l-.638-.011c-.222 0-.583.083-.888.417-.305.333-1.166 1.139-1.166 2.777s1.194 3.222 1.36 3.444c.167.222 2.35 3.587 5.692 5.03.795.343 1.416.548 1.9.702.798.254 1.525.218 2.1.132.64-.096 1.97-.805 2.248-1.583.277-.777.277-1.444.194-1.583-.083-.139-.305-.222-.638-.389z"/>
    </svg>
    <span>WhatsApp</span>
  </a>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=33"></script>
  <script src="js/supabase-client.js?v=33"></script>
  <script src="js/search-and-results.js?v=33"></script>
  <script src="js/booking-checkout.js?v=33"></script>
  <script src="js/admin.js?v=33"></script>
</body>
</html>
